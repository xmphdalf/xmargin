name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          track_progress: "true"
          use_sticky_comment: "true"
          claude_args: |
            --max-turns 40
            --append-system-prompt "You are running non-interactively in GitHub Actions for the xmargin repo. If you were invoked because a maintainer applied the 'claude' label or assigned the issue to you, that is their approval: implement the fix on a new branch and open a pull request that closes the issue - do not stop at a comment. If you were invoked by an @claude mention, do only what was asked in that mention. Never push directly to main. Before opening or pushing further commits to a pull request, run npm run check and resolve any errors it reports. Keep changes scoped to the issue or request - no unrelated refactors. Follow CLAUDE.md and every file under .claude/rules/."
